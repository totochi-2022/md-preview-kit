<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" xml:lang="en" height="143.8pt" width="249.16399999999996pt" viewBox="-46.696 -139.2 249.16399999999996 143.8">
<metadata id="diagram-source" data-type="python"><![CDATA[import schemdraw
import schemdraw.elements as elm

if out.endswith(".svg"):
    schemdraw.use("svg")

d = schemdraw.Drawing(show=False)
V = elm.SourceSin().up().label("Vin")
d += V
d += elm.Resistor().right().label("R1 10k")
node = elm.Dot()
d += node
d += elm.Capacitor().down().label("C1 100nF")
d += elm.Line().left().tox(V.start)
d += elm.Line().toy(V.start)
d += elm.Line().right().at(node.center).length(1.5)
d += elm.Dot(open=True).label("Vout", loc="right")
d.save(out)
]]></metadata>
